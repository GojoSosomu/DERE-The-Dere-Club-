<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <title>Visual Novel UI</title>
</head>
<body>
    <div class="game-screen">
        <div class="main-menu page">
            <div class="title">
                <img src="images/background/Title.png" alt="Title">
            </div>

            <div class="main-menu-button">
                <button class="main-button" id="setting" type="button">Setting</button>
                <button class="main-button" id="start" type="button">▶</button>
                <button class="main-button" id="about" type="button">About</button>
            </div>
        </div>
        <div class="gameplay page" hidden>
            <img src="images/background/classroom.jpg" class="background" alt="Background">

            <div class="player-info">
                <!-- affection meters, stats, whatever state you're tracking -->
            </div>

            <div class="menu-button">
                <button id="open-menu">☰</button>
            </div>

            <div class="stage">
                <div class="slot" id="far-left"></div>
                <div class="slot" id="left"></div>
                <div class="slot" id="center"></div>
                <div class="slot" id="right"></div>
                <div class="slot" id="far-right"></div>
            </div>

            <div class="dialogue-box">
                <div class="speaker"></div>
                <div class="dialogue-content">
                    <img src="" class="speaker-profile">
                    <p></p>
                </div>
                <div class="next-indicator">▼</div>
            </div>

            <div class="choice-popup" hidden>
                <div class="choice-options"></div>
            </div>
        </div>
    </div>

    <script src="scripts/main.js"></script>
</body>
</html>
