 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Visual Novel UI</title>
</head>
<body>

    <div class="game-screen">
        <div class="gameplay">
            <img src="images/classroom.jpg" class="background-game" alt="Background">

            <div class="stage">
                <div class="slot" id="far-left"></div>
                <div class="slot" id="left"></div>
                <div class="slot" id="center">
                </div>
                <div class="slot" id="right"></div>
                <div class="slot" id="far-right"></div>
            </div>

            <div class="dialogue-box">
                <div class="speaker">Kyle</div>

                <div class="dialogue-content">
                    <img src="images/Angel Naval Profile.png" class="speaker-profile" alt="Angel Naval">
                    <p>...</p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
